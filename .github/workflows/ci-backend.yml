name: CI Backend

# 검증 전용 워크플로 — 배포/시크릿/레포 쓰기 없음.
# backend/ changes on main/develop and PRs. No publishing.
on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

# 같은 ref 에 새 커밋이 오면 진행 중이던 런은 취소.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_fixture_only
          POSTGRES_DB: humtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLOUD_TEST_PG_URI: postgresql://postgres:local_ci_fixture_only@127.0.0.1:5432/humtrack_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # backend/Dockerfile 의 python:3.11-slim 과 동일 메이저·마이너.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # backend/Dockerfile 의 system deps 와 같은 집합.
      #   ffmpeg      → Opus/m4a/webm 디코드. tests/test_autotune.py::
      #                 test_endpoint_undecodable_upload_is_400 이 이 바이너리를
      #                 요구한다 (없으면 500 "ffmpeg binary not available" → 실패).
      #   libsndfile1 → soundfile / librosa 의 WAV 읽기·쓰기.
      #   libgomp1    → librosa/numpy OpenMP 런타임 (러너에 이미 있지만 명시).
      - name: Install system deps (ffmpeg, libsndfile1, libgomp1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libgomp1
          ffmpeg -version | head -1

      # requirements-test.txt = requirements.txt + pytest.
      # requirements-dev.txt(torchcrepe→torch, ~2GB)는 테스트에 불필요 — 설치하지 않음.
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # Production credentials are never supplied. The service database above
      # runs the cloud transaction/RLS and announcement migration tests locally.
      # Legacy pre-contract live tests remain skipped; real provider acceptance
      # is a separate release gate (not replaced by the FakeR2 tests).
      - name: Run pytest
        run: python -m pytest tests -q
