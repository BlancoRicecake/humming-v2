name: CI Backend

# 검증 전용 워크플로 — 배포/시크릿/레포 쓰기 없음.
# backend/ 가 바뀐 main 푸시와 PR 에서만 돈다.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

# 같은 ref 에 새 커밋이 오면 진행 중이던 런은 취소.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # backend/Dockerfile 의 python:3.11-slim 과 동일 메이저·마이너.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # backend/Dockerfile 의 system deps 와 같은 집합.
      #   ffmpeg      → Opus/m4a/webm 디코드. tests/test_autotune.py::
      #                 test_endpoint_undecodable_upload_is_400 이 이 바이너리를
      #                 요구한다 (없으면 500 "ffmpeg binary not available" → 실패).
      #   libsndfile1 → soundfile / librosa 의 WAV 읽기·쓰기.
      #   libgomp1    → librosa/numpy OpenMP 런타임 (러너에 이미 있지만 명시).
      - name: Install system deps (ffmpeg, libsndfile1, libgomp1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libgomp1
          ffmpeg -version | head -1

      # requirements-test.txt = requirements.txt + pytest.
      # requirements-dev.txt(torchcrepe→torch, ~2GB)는 테스트에 불필요 — 설치하지 않음.
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # Supabase/R2 자격증명을 일부러 주지 않는다 → tests/test_cloud_sync.py 의
      # 11 개는 skip 유지가 정상. 기대 결과: 153 passed, 11 skipped.
      - name: Run pytest
        run: python -m pytest tests -q
