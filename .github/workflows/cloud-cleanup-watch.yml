name: Cloud cleanup watch

# Prepared only. Enable the repository variable after migration008 + backend
# rollout + a successful scheduled heartbeat. See infra/alerts/cloud-cleanup.md.
# No deployment or cleanup command.
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humtrack-cloud-cleanup-watch
  cancel-in-progress: false

jobs:
  health:
    if: vars.HUMTRACK_CLOUD_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Check private aggregate worker health
        run: |
          test -n "$FLY_API_TOKEN"
          python infra/scripts/check_cloud_cleanup.py
