name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'

permissions:
  contents: read

# Serialize production deploys; let an in-flight deploy finish rather than
# cancelling it midway (the newer run deploys right after).
concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        # Pinned CLI version; the token is read from VERCEL_TOKEN (not argv).
        run: npx --yes vercel@62.7.0 --prod --yes
        working-directory: landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
