name: CI Mobile

# 검증 전용 워크플로 — 테스트 + Android 디버그 컴파일, 업로드/배포 없음.
# (flutter 가 워크스페이스의 pubspec.lock / analysis_options.yaml 을 건드려도
#  일회성 러너 안에서 끝나고 push 하지 않는다.)
# mobile/ changes on main/develop and PRs. No publishing.
on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'infra/scripts/check_android_native_alignment.py'
      - 'infra/scripts/ci_disk_space.py'
      - 'infra/scripts/test_ci_disk_space.py'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'infra/scripts/check_android_native_alignment.py'
      - 'infra/scripts/ci_disk_space.py'
      - 'infra/scripts/test_ci_disk_space.py'
      - '.github/workflows/ci-mobile.yml'

# 같은 ref 에 새 커밋이 오면 진행 중이던 런은 취소.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    name: analyze + test + Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/ios/Gemfile
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # 2026-11-04: the Android build ran the hosted runner out of disk
      # ("No space left on device" in the runner's _diag log) after all tests
      # passed. Remove only named, unused preinstalled toolchains (.NET,
      # Haskell, Swift, CodeQL…); the Android SDK/NDK, Java, Flutter, Ruby and
      # the workspace are kept and checked. See infra/scripts/ci_disk_space.py.
      - name: Disk space (measure + reclaim unused preinstalled tools)
        working-directory: .
        run: |
          python3 infra/scripts/test_ci_disk_space.py
          python3 infra/scripts/ci_disk_space.py reclaim --min-free-gb 15

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.2'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Release helper regression tests
        run: |
          bundle exec ruby tool/release_support_test.rb
          ruby -c ios/fastlane/Fastfile
          ruby -c android/fastlane/Fastfile

      # 버전 고정 이유: analyzer 의 deprecation info 목록이 SDK 버전마다 달라져
      # 핀이 없으면 어느 날 갑자기 warning 승격으로 빌드가 깨진다. 개발 머신과
      # 동일한 3.47.1 (Dart 3.13.1) — mobile/pubspec.lock 은 dart >=3.10.0-0 요구.
      # 올릴 때는 로컬에서 analyze + test 를 먼저 통과시킨 뒤 이 값을 바꾼다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          # SDK + ~/.pub-cache 둘 다 캐시. pub 캐시 키는 lockfile 해시로 고정.
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Flutter version
        run: flutter --version

      - name: Use JDK 17 for Android
        run: flutter config --jdk-dir="$JAVA_HOME"

      # pubspec.yaml 의 dependency_overrides 가 flutter_midi_pro 포크(GitHub)를
      # 가리키므로 이 스텝은 네트워크가 필요하다 (hosted runner 는 문제 없음).
      - name: flutter pub get
        run: flutter pub get

      # flutter analyze 는 기본값이 --fatal-infos 라 알려진 info 4 건만으로도
      # exit 1 이 된다. info 는 통과시키되 warning/error 는 그대로 fatal 유지.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

      # Dart checks do not compile Kotlin/C++ or validate the Android toolchain.
      # Debug signing only; no release keys, store access or artifact upload.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android release auth guard regression tests
        run: python3 tool/test_android_auth_guard.py

      - name: Disk space before the Android build
        run: python3 ../infra/scripts/ci_disk_space.py report

      - name: Android debug build
        run: flutter build apk --debug --no-pub --target-platform android-arm64

      - name: Native 16KB ELF and APK alignment
        run: python3 ../infra/scripts/check_android_native_alignment.py build/app/outputs/flutter-apk/app-debug.apk --output build/android-16kb-ci.json

      - name: Disk space after the Android build
        if: always()
        run: python3 ../infra/scripts/ci_disk_space.py report
